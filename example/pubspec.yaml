name: example
description: A demo for the Flutter Quill
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'
dependencies:
  bloc: ^8.1.4
  cached_network_image: ^3.3.1
  cross_file: ^0.3.4
  cupertino_icons: ^1.0.6
  dart_quill_delta: 9.1.1
  desktop_drop:
    git:
      url: https://github.com/MixinNetwork/flutter-plugins.git
      path: packages/desktop_drop
      ref: 0d1ce578abddd171b309b15847bd6e4f9163881e
  equatable: ^2.0.5
  file_picker: ^8.0.0+1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  flutter_localizations:
    sdk: flutter
  flutter_quill: 9.1.1
  flutter_quill_extensions: ^10.8.5
  freezed_annotation: ^2.4.1
  google_fonts: ^6.2.1
  hydrated_bloc: ^9.1.5
  image_cropper: ^8.0.1
  json_annotation: ^4.8.1
  path: ^1.8.3
  path_provider: ^2.1.2
  share_plus: ^10.0.2
  simple_spell_checker: ^1.2.1

dependency_overrides:
  photo_view: ^0.15.0
  flutter_quill:
    path: ../
  dart_quill_delta:
    path: ../dart_quill_delta

dev_dependencies:
  build_runner: ^2.4.8
  flutter_gen_runner: ^5.4.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  # Freezed
  freezed: ^2.4.7
  # Json
  json_serializable: ^6.7.1
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

  fonts:
    - family: monospace
      fonts:
        - asset: assets/fonts/MonoSpace.ttf
    - family: serif
      fonts:
        - asset: assets/fonts/Serif.ttf
    - family: sans-serif
      fonts:
        - asset: assets/fonts/SansSerif.ttf
    - family: ibarra-real-nova
      fonts:
        - asset: assets/fonts/IbarraRealNova-Regular.ttf
    - family: square-peg
      fonts:
        - asset: assets/fonts/SquarePeg-Regular.ttf
    - family: nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
    - family: pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: roboto-mono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

flutter_gen: null
